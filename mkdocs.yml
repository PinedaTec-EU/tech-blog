site_name: Tech Blog
site_description: Articulos tecnicos sobre integracion, automatizacion y desarrollo.
site_author: PinedaTec
site_url: https://pinedatec-eu.github.io/tech-blog/
repo_url: https://github.com/PinedaTec-EU/tech-blog
edit_uri: edit/main/docs/

theme:
  name: material
  language: es
  palette:
    - scheme: slate
      primary: black
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Cambiar a modo claro
    - scheme: default
      primary: black
      accent: teal
      toggle:
        icon: material/weather-night
        name: Cambiar a modo oscuro
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.tabs
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - toc.follow

extra_css:
  - stylesheets/extra.css

nav:
  - Inicio: index.md
  - Sphere Integration Hub:
      - Motor determinista de workflows API: sphere-integration-hub/deterministic-api-workflow-engine.md
      - Debugging de produccion a las 3 AM: sphere-integration-hub/3-am-production-debugging-nightmare.md
      - Generacion de test data con LLM: sphere-integration-hub/llm-powered-test-data-generation.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search
