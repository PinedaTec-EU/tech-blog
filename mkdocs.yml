site_name: Tech Blog
site_description: Technical articles about integration, automation, and software development.
site_author: PinedaTec
site_url: https://tech-blog.pinedatec.eu/
repo_url: https://github.com/PinedaTec-EU/tech-blog
edit_uri: edit/main/docs/

theme:
  name: material
  custom_dir: overrides
  language: en
  palette:
    - scheme: slate
      primary: black
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      primary: black
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.tabs
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - toc.follow

extra_css:
  - stylesheets/extra-20260507.css?v=compact-author

nav:
  - Home: index.md
  - SpecForge.AI:
      - Overview: specforge-ai/index.md
      - Spec-Driven Development needs seven layers of control: specforge-ai/seven-layers-of-spec-driven-development.md
      - AI-assisted development has a governance problem: specforge-ai/governed-ai-assisted-development.md
  - Sphere Integration Hub:
      - Overview: sphere-integration-hub/index.md
      - Postman Collections Rot When API Teams Scale: sphere-integration-hub/postman-collections-rot-when-api-teams-scale.md
      - Simulate Concurrent Users and Catch Latency Spikes with a Deterministic Workflow: sphere-integration-hub/simulate-concurrent-users-and-catch-latency-spikes.md
      - Switching Issues Should Not Mean Rebuilding Test Context: sphere-integration-hub/switching-issues-should-not-mean-rebuilding-test-context.md
      - Deterministic API Workflow Engine: sphere-integration-hub/deterministic-api-workflow-engine.md
      - The 3 AM Production Debugging Nightmare: sphere-integration-hub/3-am-production-debugging-nightmare.md
      - LLM-Powered Test Data Generation: sphere-integration-hub/llm-powered-test-data-generation.md
      - LLM Model Evaluation as a Workflow: sphere-integration-hub/llm-model-evaluation-as-a-workflow.md
      - Keep Cloudflare DNS Records Synced from a Workflow: sphere-integration-hub/cloudflare-dns-public-ip-sync.md

markdown_extensions:
  - admonition
  - attr_list
  - meta
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search

extra:
  social_image: assets/images/sphere-integration-hub/SIH.png
