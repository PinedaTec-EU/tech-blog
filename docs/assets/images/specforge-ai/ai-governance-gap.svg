<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">AI-assisted development governance gap</title>
  <desc id="desc">A comparison between license-only AI adoption and governed AI-assisted delivery.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071817"/>
      <stop offset="0.52" stop-color="#102f2b"/>
      <stop offset="1" stop-color="#071817"/>
    </linearGradient>
    <linearGradient id="left" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b1f26"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="right" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#123a34"/>
      <stop offset="1" stop-color="#16252a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <style>
      .title { fill: #f4fbf8; font: 700 46px Inter, Arial, sans-serif; letter-spacing: 0; }
      .subtitle { fill: #b9d0c9; font: 400 24px Inter, Arial, sans-serif; letter-spacing: 0; }
      .panel-title { fill: #ffffff; font: 700 28px Inter, Arial, sans-serif; letter-spacing: 0; }
      .panel-note { fill: #c9d7d2; font: 400 18px Inter, Arial, sans-serif; letter-spacing: 0; }
      .label { fill: #ecf7f3; font: 700 18px Inter, Arial, sans-serif; letter-spacing: 0; }
      .small { fill: #aebfba; font: 400 15px Inter, Arial, sans-serif; letter-spacing: 0; }
      .risk { fill: #ffd7d7; font: 700 16px Inter, Arial, sans-serif; letter-spacing: 0; }
      .proof { fill: #d8fff1; font: 700 16px Inter, Arial, sans-serif; letter-spacing: 0; }
      .muted-stroke { stroke: #6e837e; stroke-width: 2; stroke-dasharray: 7 10; fill: none; opacity: 0.55; }
      .flow { stroke: #98f0d2; stroke-width: 4; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .broken { stroke: #ff9b9b; stroke-width: 4; fill: none; stroke-linecap: round; stroke-dasharray: 12 14; }
      .chip { fill: rgba(255,255,255,0.06); stroke: rgba(255,255,255,0.16); stroke-width: 1.5; }
      .bad-chip { fill: rgba(255,120,120,0.08); stroke: rgba(255,150,150,0.22); stroke-width: 1.5; }
      .good-chip { fill: rgba(99,230,180,0.09); stroke: rgba(120,245,202,0.28); stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="1400" height="760" fill="url(#bg)"/>
  <circle cx="190" cy="110" r="110" fill="#2f6f62" opacity="0.10"/>
  <circle cx="1210" cy="660" r="150" fill="#47d6a4" opacity="0.08"/>

  <text x="70" y="78" fill="#f4fbf8" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="700" letter-spacing="0">AI-assisted development has a governance gap</text>
  <text x="72" y="118" fill="#b9d0c9" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" letter-spacing="0">Licenses increase speed. Teams still need specifications, traceability, review evidence, and a source of truth.</text>

  <g filter="url(#shadow)">
    <rect x="70" y="175" width="580" height="500" rx="14" fill="url(#left)" stroke="#68434a" stroke-width="1.5"/>
    <rect x="750" y="175" width="580" height="500" rx="14" fill="url(#right)" stroke="#2d665c" stroke-width="1.5"/>
  </g>

  <text x="110" y="228" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" letter-spacing="0">License-only AI adoption</text>
  <text x="110" y="260" fill="#c9d7d2" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" letter-spacing="0">Every developer gets a tool. The process stays informal.</text>

  <g transform="translate(110 305)">
    <rect class="bad-chip" x="0" y="0" width="205" height="58" rx="10"/>
    <text x="18" y="26" fill="#ecf7f3" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="0">Prompt</text>
    <text x="18" y="47" fill="#aebfba" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" letter-spacing="0">local context</text>

    <rect class="bad-chip" x="255" y="0" width="205" height="58" rx="10"/>
    <text x="273" y="26" fill="#ecf7f3" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="0">Generated diff</text>
    <text x="273" y="47" fill="#aebfba" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" letter-spacing="0">plausible output</text>

    <rect class="bad-chip" x="128" y="120" width="205" height="58" rx="10"/>
    <text x="146" y="146" fill="#ecf7f3" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="0">Manual PR</text>
    <text x="146" y="167" fill="#aebfba" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" letter-spacing="0">summary by memory</text>

    <path class="broken" d="M205 29 H255"/>
    <path class="broken" d="M358 58 C358 92 300 102 258 120"/>
    <path class="broken" d="M128 149 C72 146 44 120 42 86"/>

    <rect class="chip" x="0" y="215" width="460" height="130" rx="12"/>
    <text x="22" y="248" fill="#ffd7d7" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="0">Common failure modes</text>
    <text x="22" y="282" fill="#aebfba" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" letter-spacing="0">No approved baseline</text>
    <text x="22" y="314" fill="#aebfba" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" letter-spacing="0">Assumptions hidden in chat</text>
  </g>

  <path class="muted-stroke" d="M690 210 V650"/>
  <text x="665" y="420" fill="#aebfba" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" letter-spacing="0" transform="rotate(-90 665 420)">the missing operating model</text>

  <text x="790" y="228" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" letter-spacing="0">Governed AI-assisted delivery</text>
  <text x="790" y="260" fill="#c9d7d2" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" letter-spacing="0">The agent works inside explicit phases and persisted artifacts.</text>

  <g transform="translate(790 305)">
    <rect class="good-chip" x="0" y="0" width="165" height="58" rx="10"/>
    <text x="18" y="26" fill="#ecf7f3" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="0">Request</text>
    <text x="18" y="47" fill="#aebfba" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" letter-spacing="0">intent captured</text>

    <rect class="good-chip" x="205" y="0" width="165" height="58" rx="10"/>
    <text x="223" y="26" fill="#ecf7f3" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="0">Spec</text>
    <text x="223" y="47" fill="#aebfba" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" letter-spacing="0">baseline</text>

    <rect class="good-chip" x="410" y="0" width="165" height="58" rx="10"/>
    <text x="428" y="26" fill="#ecf7f3" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="0">Design</text>
    <text x="428" y="47" fill="#aebfba" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" letter-spacing="0">approach</text>

    <rect class="good-chip" x="0" y="120" width="165" height="58" rx="10"/>
    <text x="18" y="146" fill="#ecf7f3" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="0">Code</text>
    <text x="18" y="167" fill="#aebfba" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" letter-spacing="0">scoped change</text>

    <rect class="good-chip" x="205" y="120" width="165" height="58" rx="10"/>
    <text x="223" y="146" fill="#ecf7f3" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="0">Review</text>
    <text x="223" y="167" fill="#aebfba" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" letter-spacing="0">evidence</text>

    <rect class="good-chip" x="410" y="120" width="165" height="58" rx="10"/>
    <text x="428" y="146" fill="#ecf7f3" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="0">Release</text>
    <text x="428" y="167" fill="#aebfba" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" letter-spacing="0">human gate</text>

    <path class="flow" d="M165 29 H205"/>
    <path class="flow" d="M370 29 H410"/>
    <path class="flow" d="M492 58 V88 C492 108 470 120 445 120"/>
    <path class="flow" d="M410 149 H370"/>
    <path class="flow" d="M205 149 H165"/>

    <rect class="chip" x="0" y="215" width="575" height="130" rx="12"/>
    <text x="22" y="248" fill="#d8fff1" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="0">What the team can inspect</text>
    <text x="22" y="282" fill="#aebfba" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" letter-spacing="0">Approved specification, prompts, context, decisions, review result</text>
    <text x="22" y="314" fill="#aebfba" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" letter-spacing="0">Regression path when spec, design, or implementation is wrong</text>
  </g>
</svg>
