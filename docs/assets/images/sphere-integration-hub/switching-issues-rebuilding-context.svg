  <text x="128" y="286" fill="#98AAB5" font-family="Arial, sans-serif" font-size="28">Manual setup chaos across tools, people, and undocumented step order</text>

  <rect x="148" y="384" width="270" height="140" rx="24" fill="url(#toolCard)" stroke="#4D6877" stroke-opacity="0.75" stroke-width="2"/>
