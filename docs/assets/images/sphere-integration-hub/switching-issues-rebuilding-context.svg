  <text x="186" y="484" fill="#A8BCC7" font-family="Arial, sans-serif" font-size="23">One developer's</text>
  <text x="186" y="515" fill="#A8BCC7" font-family="Arial, sans-serif" font-size="23">request flow</text>

  <rect x="472" y="384" width="270" height="140" rx="24" fill="url(#toolCard)" stroke="#4D6877" stroke-opacity="0.75" stroke-width="2"/>
  <text x="510" y="438" fill="#EDF4F7" font-family="Arial, sans-serif" font-size="34" font-weight="700">Python</text>
  <text x="510" y="484" fill="#A8BCC7" font-family="Arial, sans-serif" font-size="23">QA helper scripts</text>

  <rect x="796" y="384" width="270" height="140" rx="24" fill="url(#toolCard)" stroke="#4D6877" stroke-opacity="0.75" stroke-width="2"/>
  <text x="834" y="438" fill="#EDF4F7" font-family="Arial, sans-serif" font-size="34" font-weight="700">SQL</text>
  <text x="834" y="484" fill="#A8BCC7" font-family="Arial, sans-serif" font-size="23">Direct state tweaks</text>

  <rect x="1120" y="384" width="270" height="140" rx="24" fill="url(#toolCard)" stroke="#4D6877" stroke-opacity="0.75" stroke-width="2"/>
  <text x="1158" y="438" fill="#EDF4F7" font-family="Arial, sans-serif" font-size="34" font-weight="700">Browser</text>
  <text x="1158" y="484" fill="#A8BCC7" font-family="Arial, sans-serif" font-size="23">Manual confirmation</text>
  <text x="1158" y="515" fill="#A8BCC7" font-family="Arial, sans-serif" font-size="23">steps</text>

  <line x1="283" y1="524" x2="648" y2="670" stroke="#BF7B67" stroke-width="5" stroke-linecap="round" stroke-opacity="0.95"/>
  <line x1="607" y1="524" x2="718" y2="670" stroke="#BF7B67" stroke-width="5" stroke-linecap="round" stroke-opacity="0.95"/>
  <line x1="931" y1="524" x2="788" y2="670" stroke="#BF7B67" stroke-width="5" stroke-linecap="round" stroke-opacity="0.95"/>
  <line x1="1255" y1="524" x2="858" y2="670" stroke="#BF7B67" stroke-width="5" stroke-linecap="round" stroke-opacity="0.95"/>

  <rect x="566" y="668" width="468" height="144" rx="28" fill="url(#chaosCard)" stroke="#A7646F" stroke-opacity="0.9" stroke-width="2"/>
  <text x="618" y="727" fill="#F7ECEE" font-family="Arial, sans-serif" font-size="34" font-weight="700">Issue setup chaos</text>
  <text x="618" y="772" fill="#DAB8BE" font-family="Arial, sans-serif" font-size="24">Different orders, different shortcuts,</text>
  <text x="618" y="803" fill="#DAB8BE" font-family="Arial, sans-serif" font-size="24">different outcomes</text>
