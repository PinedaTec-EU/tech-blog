<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="120" y1="80" x2="1480" y2="820" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A1116"/>
      <stop offset="1" stop-color="#121B22"/>
    </linearGradient>
    <linearGradient id="panel" x1="120" y1="120" x2="1440" y2="780" gradientUnits="userSpaceOnUse">
      <stop stop-color="rgba(34,48,60,0.78)"/>
      <stop offset="1" stop-color="rgba(16,24,31,0.9)"/>
    </linearGradient>
    <linearGradient id="toolCard" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#243542" stop-opacity="0.72"/>
      <stop offset="1" stop-color="#18232D" stop-opacity="0.88"/>
    </linearGradient>
    <linearGradient id="chaosCard" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#3A2328" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#25171B" stop-opacity="0.96"/>
    </linearGradient>
    <filter id="softBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="#1B1B1B"/>
  <rect x="56" y="56" width="1488" height="788" rx="28" fill="url(#bg)"/>
  <rect x="112" y="112" width="1376" height="676" rx="34" fill="#A7C0CF" fill-opacity="0.045" stroke="#506572" stroke-opacity="0.55" stroke-width="2"/>
  <ellipse cx="1305" cy="170" rx="170" ry="90" fill="#8AA3B3" fill-opacity="0.08" filter="url(#softBlur)"/>
  <ellipse cx="264" cy="720" rx="190" ry="110" fill="#6B7C87" fill-opacity="0.08" filter="url(#softBlur)"/>

  <text x="126" y="170" fill="#E6EEF2" font-family="Arial, sans-serif" font-size="54" font-weight="700">Switching issues should not mean</text>
