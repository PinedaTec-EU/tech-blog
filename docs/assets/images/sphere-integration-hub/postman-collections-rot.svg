<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Postman collection drift converted into pull request validation</title>
  <desc id="desc">A technical diagram showing a stale external API collection moving into code review, contract validation, execution evidence, and audit artifacts.</desc>
  <defs>
    <linearGradient id="bg" x1="90" y1="60" x2="1510" y2="840" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#06131a"/>
      <stop offset="0.48" stop-color="#102a34"/>
      <stop offset="1" stop-color="#17211e"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#173946"/>
      <stop offset="1" stop-color="#0d2028"/>
    </linearGradient>
    <linearGradient id="good" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f8f6b"/>
      <stop offset="1" stop-color="#0f5d52"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.14 0 0 0 0 0.82 0 0 0 0 0.70 0 0 0 0.42 0"/>
      <feBlend in="SourceGraphic"/>
    </filter>
    <marker id="arrow" markerWidth="16" markerHeight="16" refX="12" refY="8" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2 L14 8 L2 14 Z" fill="#72d8c8"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1320" cy="150" r="170" fill="#72d8c8" opacity="0.08" filter="url(#glow)"/>
  <circle cx="260" cy="740" r="210" fill="#f59e0b" opacity="0.08"/>

  <text x="110" y="135" fill="#edf7f4" font-family="Arial, sans-serif" font-size="52" font-weight="700">API workflow evidence belongs in the pull request</text>
  <text x="112" y="183" fill="#9db9b5" font-family="Arial, sans-serif" font-size="25">Stale collections become versioned workflows, contract gates, and reviewable execution artifacts.</text>

  <rect x="110" y="282" width="355" height="230" rx="28" fill="#2a1d15" stroke="#be7c36" stroke-width="2"/>
  <text x="145" y="344" fill="#ffdfb1" font-family="Arial, sans-serif" font-size="30" font-weight="700">External collection</text>
  <text x="145" y="395" fill="#d7b596" font-family="Arial, sans-serif" font-size="22">400 requests</text>
  <text x="145" y="430" fill="#d7b596" font-family="Arial, sans-serif" font-size="22">unknown freshness</text>
  <text x="145" y="465" fill="#d7b596" font-family="Arial, sans-serif" font-size="22">manual ownership</text>

  <line x1="494" y1="397" x2="640" y2="397" stroke="#72d8c8" stroke-width="6" marker-end="url(#arrow)"/>

  <rect x="675" y="248" width="330" height="300" rx="28" fill="url(#panel)" stroke="#497181" stroke-width="2"/>
  <text x="720" y="312" fill="#e8f5f2" font-family="Arial, sans-serif" font-size="30" font-weight="700">Code review</text>
  <rect x="720" y="355" width="240" height="42" rx="11" fill="#0b1f28" stroke="#3f6570"/>
  <text x="742" y="383" fill="#9debdc" font-family="JetBrains Mono, monospace" font-size="18">*.workflow</text>
  <rect x="720" y="418" width="240" height="42" rx="11" fill="#0b1f28" stroke="#3f6570"/>
  <text x="742" y="446" fill="#9debdc" font-family="JetBrains Mono, monospace" font-size="18">api.catalog</text>
  <rect x="720" y="481" width="240" height="42" rx="11" fill="#0b1f28" stroke="#3f6570"/>
  <text x="742" y="509" fill="#9debdc" font-family="JetBrains Mono, monospace" font-size="18">workflows.config</text>

  <line x1="1034" y1="397" x2="1180" y2="397" stroke="#72d8c8" stroke-width="6" marker-end="url(#arrow)"/>

  <rect x="1215" y="282" width="275" height="230" rx="28" fill="url(#good)" stroke="#75e3cf" stroke-width="2"/>
  <text x="1250" y="344" fill="#eafffb" font-family="Arial, sans-serif" font-size="30" font-weight="700">PR gate</text>
  <text x="1250" y="395" fill="#d4fff6" font-family="Arial, sans-serif" font-size="22">dry-run validation</text>
  <text x="1250" y="430" fill="#d4fff6" font-family="Arial, sans-serif" font-size="22">contract check</text>
  <text x="1250" y="465" fill="#d4fff6" font-family="Arial, sans-serif" font-size="22">HTML + JSON report</text>

  <rect x="238" y="645" width="1124" height="92" rx="24" fill="#091c24" stroke="#385a65" stroke-width="2"/>
  <text x="286" y="704" fill="#bfeee7" font-family="JetBrains Mono, monospace" font-size="24">sih --workflow smoke-api.workflow --env pr --dry-run --verbose</text>
</svg>
